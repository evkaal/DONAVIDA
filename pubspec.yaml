name: donavida_app
description: "Aplicación móvil DONAVIDA para gestión hospitalaria de hemoderivados."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Iconos Cupertino
  cupertino_icons: ^1.0.8

  # Gestión de estado (Bloc / Cubit)
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Cliente HTTP para API REST de Go
  dio: ^5.4.3+1

  # Almacenamiento seguro del JWT
  flutter_secure_storage: ^9.0.0

  # Preferencias locales
  shared_preferences: ^2.2.3

  # Tipografía y UI
  google_fonts: ^6.2.1

  # Mapas reales con OpenStreetMap (Sin tarjeta ni API keys)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
